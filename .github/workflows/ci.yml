name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: pip install -r requirements.txt pytest
      - name: Run tests
        run: pytest

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image
        run: docker build -t qr-code-generator-app .
      - name: Run the container with a volume
        run: |
          mkdir qr_codes && chmod 777 qr_codes
          docker run --rm -v "$PWD/qr_codes:/app/qr_codes" -e FILL_COLOR=blue qr-code-generator-app --url https://www.njit.edu
      - name: Confirm the QR code was written
        run: ls qr_codes/QRCode_*.png
